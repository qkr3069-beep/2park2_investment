<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>이박이 인베스트먼트 뉴스 브리핑</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" />
  <style>
    :root{
      --brand-primary:#0f3a3a;
      --brand-primary-700:#0a2b2b;
      --brand-primary-50:#f7f4ef;
      --brand-text:#0f3a3a;
      --brand-muted:#4b5e5e;
      --brand-card:#ffffff;
      --brand-divider:#e5e1d8;
      --brand-radius:14px;
      --brand-shadow:0 6px 18px rgba(0,0,0,0.08);
    }

    html,body{
      font-family:"Pretendard Variable",Pretendard,sans-serif;
    }

    .brand-header{ background:#F7F3ED; }

    .brand-btn{
      background:var(--brand-primary);
      color:#f9fafb;
      padding:10px 18px;
      border-radius:9999px;
      font-weight:700;
    }

    .brand-section-title{
      font-weight:800;
      border-left:6px solid var(--brand-primary);
      padding-left:10px;
    }

    .brand-card{
      background:var(--brand-card);
      border-radius:var(--brand-radius);
      box-shadow:var(--brand-shadow);
      border:1px solid #11182720;
    }

    .brand-link{
      color:#22c55e;
      font-weight:700;
    }

    .badge-link{
      background:#22c55e33;
      padding:6px 10px;
      border-radius:9999px;
      color:#f9fafb;
    }

    .brand-divider{
      border-top:1px dashed var(--brand-divider);
    }

    input[type="date"]{
      color:black;
    }
  </style>
</head>

<body class="bg-[var(--brand-primary-50)] text-[var(--brand-text)] min-h-screen">

<header class="brand-header text-white">
  <div class="max-w-6xl mx-auto px-5 py-5 flex flex-col gap-4">

    <div class="flex flex-col lg:flex-row lg:justify-between gap-4">
      <div class="flex flex-col items-start gap-0 text-left">
        <a href="index.html" class="block">
          <img
            src="2park2 investment_logo.png"
            alt="이박이 인베스트먼트 로고"
            class="h-24 md:h-28 lg:h-32 object-contain cursor-pointer"
          />
        </a>

        <div class="flex gap-3 items-center flex-wrap mt-1">
          <h1 class="text-xl lg:text-2xl font-extrabold text-[#0A3A32]">
            이박이 인베스트먼트 뉴스 브리핑
          </h1>
          <a href="https://www.korea.kr/" target="_blank" rel="noopener"
             class="badge-link text-white font-bold text-sm">
            정책브리핑 바로가기
          </a>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <input type="date" id="datePicker"
               class="px-3 py-2 rounded-xl bg-white text-black" />
        <button onclick="loadAllNews()"
                class="brand-btn hover:bg-[var(--brand-primary-700)] transition">
          조회
        </button>
      </div>
    </div>

    <div class="flex flex-wrap gap-3 mt-1">
      <a href="sun_manager.html"
         class="px-4 py-2 rounded-full bg-white text-[var(--brand-primary)] font-semibold text-sm shadow hover:bg-[#e6f3f1] transition">
        선 매니저 페이지 →
      </a>
      <a href="hong_manager.html"
         class="px-4 py-2 rounded-full bg-white text-[var(--brand-primary)] font-semibold text-sm shadow hover:bg-[#e6f3f1] transition">
        홍 매니저 페이지 →
      </a>
      <a href="dong_manager.html"
         class="px-4 py-2 rounded-full bg-white text-[var(--brand-primary)] font-semibold text-sm shadow hover:bg-[#e6f3f1] transition">
        동 매니저 페이지 →
      </a>
    </div>

  </div>
</header>

<main class="max-w-6xl mx-auto px-5 py-4 space-y-6">

  <section id="market-charts" class="space-y-4 mb-4">
    <h2 class="brand-section-title text-xl">주요 시장 차트</h2>

    <div id="macro-chart-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    <div class="brand-divider mt-4"></div>
  </section>

  <section class="space-y-4">
    <div id="news-container" class="space-y-6"></div>
  </section>

</main>

<script>
const MACRO_CHARTS = [
  {
    title: "달러/원 환율 (USD/KRW)",
    desc: "한국 시장 외국인 수급·환율 압력",
    symbol: "FX_IDC:USDKRW"
  },
  {
    title: "금 시세 (XAU/USD)",
    desc: "안전자산 선호·전쟁 리스크",
    symbol: "FX_IDC:XAUUSD"
  },
  {
    title: "WTI 원유 (Crude Oil)",
    desc: "인플레이션·지정학 리스크",
    symbol: "TVC:USOIL"
  },
  {
    title: "미국 10년물 국채 ETF (IEF)",
    desc: "미국 중장기 금리 흐름 대체지표",
    symbol: "NASDAQ:IEF"
  },
  {
    title: "VIX 공포지수 대체 (VXX)",
    desc: "시장 공포·변동성 압력",
    symbol: "AMEX:VXX"
  },
  {
    title: "달러 인덱스 ETF (UUP)",
    desc: "달러 강세·약세 흐름 대체지표",
    symbol: "AMEX:UUP"
  },
  {
    title: "연준 총자산 (Fed Balance Sheet)",
    desc: "유동성 공급·축소 흐름",
    symbol: "FRED:WALCL"
  },
  {
    title: "비트코인 (BTC/USD)",
    desc: "위험자산 선호·유동성 민감도",
    symbol: "CRYPTO:BTCUSD"
  },
  {
    title: "반도체 ETF (SOXX)",
    desc: "AI·반도체·기술주 심리",
    symbol: "NASDAQ:SOXX"
  },
  {
    title: "발틱운임지수 (BDI)",
    desc: "글로벌 교역·실물 경기 흐름",
    symbol: "INDEX:BDI"
  },
  {
    title: "천연가스 ETF (UNG)",
    desc: "에너지 수급·전쟁 리스크 대체지표",
    symbol: "AMEX:UNG"
  },
  {
    title: "달러/위안화 (USD/CNH)",
    desc: "중국 리스크·신흥국 압력",
    symbol: "FX_IDC:USDCNH"
  },
  {
    title: "미국 하이일드 채권 ETF (HYG)",
    desc: "신용위험·기관 자금 스트레스",
    symbol: "AMEX:HYG"
  }
];

function tradingViewUrl(symbol){
  return "https://s.tradingview.com/widgetembed/?symbol=" +
    encodeURIComponent(symbol) +
    "&interval=D&theme=light&style=1&locale=kr&toolbarbg=f1f3f6&hidetoptoolbar=1&hidesidetoolbar=1&hidelegend=1";
}

function renderMacroCharts(){
  const grid = document.getElementById("macro-chart-grid");
  grid.innerHTML = "";

  MACRO_CHARTS.forEach(chart => {
    const card = document.createElement("div");
    card.className = "brand-card p-3";

    card.innerHTML = `
      <div class="mb-2">
        <h3 class="font-bold text-sm text-[var(--brand-text)]">${chart.title}</h3>
        <p class="text-xs text-[var(--brand-muted)] mt-1">${chart.desc}</p>
      </div>
      <iframe
        src="${tradingViewUrl(chart.symbol)}"
        style="width:100%;height:240px;"
        frameborder="0"
        allowtransparency="true"
        scrolling="no">
      </iframe>
    `;

    grid.appendChild(card);
  });
}

/* 국내/국외 경제 뉴스 */
const feeds = {
  "주요 경제 뉴스(국내)":
    "https://news.google.com/rss/search?q=" +
    encodeURIComponent("증시 OR 물가 OR 금리 OR 환율 OR 경기 OR 경제 OR 코스피 OR 코스닥") +
    "&hl=ko&gl=KR&ceid=KR:ko",

  "주요 경제 뉴스(국외)":
    "https://news.google.com/rss/search?q=" +
    encodeURIComponent("global economy OR inflation OR interest rates OR stock market OR Fed OR recession OR liquidity OR geopolitics") +
    "&hl=en-US&gl=US&ceid=US:en"
};

const CATEGORY_KEYWORDS = {
  "주요 경제 뉴스(국내)": ["증시","물가","금리","환율","경기","경제","코스피","코스닥"],
  "주요 경제 뉴스(국외)": ["global economy","inflation","interest rates","stock market","Fed","recession","liquidity","geopolitics"]
};

const TOP_PAGE = {
  "주요 경제 뉴스(국내)":
    "https://news.google.com/search?q=" +
    encodeURIComponent("증시 OR 물가 OR 금리 OR 환율 OR 경기 OR 경제 OR 코스피 OR 코스닥") +
    "&hl=ko&gl=KR&ceid=KR:ko",

  "주요 경제 뉴스(국외)":
    "https://news.google.com/search?q=" +
    encodeURIComponent("global economy OR inflation OR interest rates OR stock market OR Fed OR recession OR liquidity OR geopolitics") +
    "&hl=en-US&gl=US&ceid=US:en"
};

function buildMoreLink(cat){
  if (TOP_PAGE[cat]) return TOP_PAGE[cat];
  const terms = CATEGORY_KEYWORDS[cat];
  if (!terms) return "#";
  const q = terms.map(t=>`%22${encodeURIComponent(t)}%22`).join("%20OR%20");
  return `https://news.google.com/search?q=${q}&hl=ko&gl=KR&ceid=KR%3Ako`;
}

function parseYMD(v){
  const [a,b,c] = v.split("-").map(Number);
  return new Date(a, b - 1, c);
}

function isSameDate(dt, sel){
  return Math.abs((new Date(dt) - parseYMD(sel)) / 86400000) <= 1;
}

async function fetchRSS(u){
  const r = await fetch(
    "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(u)
  );
  return r.json();
}

function renderSection(wrap, cat, items, selDate){
  let num = 0;
  const sec = document.createElement("section");

  sec.innerHTML = `
    <div class="flex justify-between items-center mb-2">
      <h2 class="brand-section-title text-xl">${cat}</h2>
      <a href="${buildMoreLink(cat)}" target="_blank"
         class="px-3 py-1 bg-[var(--brand-primary)] text-white rounded-md text-sm hover:bg-[var(--brand-primary-700)] transition">
        더보기
      </a>
    </div>
  `;

  for(const it of items || []){
    if(num >= 5) break;
    if(!isSameDate(it.pubDate, selDate)) continue;

    const clean = (it.description || "").replace(/<[^>]+>/g," ").slice(0, 80);

    sec.innerHTML += `
      <div class="brand-card p-4 mt-2">
        <a class="brand-link block mb-1" href="${it.link}" target="_blank">
          ${it.title}
        </a>
        <p class="text-sm text-[var(--brand-muted)] brand-sub">
          ${clean}...
        </p>
      </div>
    `;
    num++;
  }

  if(num === 0){
    sec.innerHTML += `
      <p class="brand-sub text-[var(--brand-muted)]">
        해당 날짜의 경제 뉴스가 없어요. 날짜를 바꾸거나 더보기를 눌러보세요.
      </p>
    `;
  }

  sec.innerHTML += `<div class="brand-divider mt-4 mb-2"></div>`;
  wrap.appendChild(sec);
}

async function loadAllNews(){
  const selDate = document.getElementById("datePicker").value;
  const c = document.getElementById("news-container");
  c.innerHTML = "";

  for(const [cat, url] of Object.entries(feeds)){
    const d = await fetchRSS(url);
    renderSection(c, cat, d.items || [], selDate);
  }
}

window.onload = () => {
  document.getElementById("datePicker").value =
    new Date().toISOString().slice(0,10);

  renderMacroCharts();
  loadAllNews();
};
</script>

</body>
</html>
